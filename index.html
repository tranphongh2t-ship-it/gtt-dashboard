<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gỗ Thanh Thùy — Marketing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #40123e;
      --accent: #9d5799;
      --bg: #f7f5f2;
      --card: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 40px 20px; max-width: 600px; width: 100%; }
    .logo-area { margin-bottom: 48px; }
    .logo-area h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .logo-area p { color: #69626a; font-size: 14px; }
    .cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .card {
      background: var(--card);
      border: 1px solid #efefef;
      border-radius: 12px;
      padding: 40px 32px;
      width: 240px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(157,87,153,0.12);
      transform: translateY(-2px);
    }
    .card-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #f0dbef, #eec277);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--primary);
    }
    .card h2 { font-size: 15px; font-weight: 700; color: var(--primary); }
    .card p { font-size: 12px; color: #69626a; line-height: 1.5; }
    .footer { margin-top: 56px; font-size: 11px; color: #b6b1b7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <h1>GỖ THANH THÙY</h1>
      <p>Hệ thống quản lý nội dung & đề xuất</p>
    </div>

    <div class="cards">
      <a href="gtt-content-plan.html" class="card">
        <div class="card-icon">📅</div>
        <h2>Content Social Media</h2>
        <p>Lịch đăng bài, quản lý nền tảng, theo dõi trạng thái</p>
      </a>
      <a href="gtt-de-xuat-noi-dung.html" class="card">
        <div class="card-icon">📝</div>
        <h2>Đề Xuất Nội Dung</h2>
        <p>Tạo đề xuất, theo dõi duyệt, phê duyệt chi phí</p>
      </a>
    </div>

    <div class="footer">© 2026 Gỗ Thanh Thùy</div>
  </div>
</body>
</html>
